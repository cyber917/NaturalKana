name: Shared core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path NaturalSuggestCore
      - run: python3 tools/check_public_source.py
      - name: Chat dictionary import and reproducibility
        run: |
          python3 -m unittest discover -s tools/tests
          python3 tools/export_pinyin_chat.py
          git diff --exit-code -- NaturalSuggestCore/Sources/NaturalSuggestCore/Resources/KeyboardLexicons/zh-chat-pinyin.txt
      - name: Shell scripts parse under UTF-8
        # macOS bash 3.2 reads some UTF-8 bytes as identifier characters, so "$var，" breaks; write "${var}，".
        run: |
          perl -ne 'if (/\$[A-Za-z_][A-Za-z0-9_]*[\x80-\xff]/) { print "$ARGV:$.: $_"; $bad = 1 } close ARGV if eof; END { exit $bad }' tools/*.sh
          for f in tools/*.sh; do LC_ALL=en_US.UTF-8 bash -n "$f"; done
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test windows/NaturalKana.Windows.Tests
