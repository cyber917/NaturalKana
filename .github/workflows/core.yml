name: Shared core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path NaturalSuggestCore
      - run: python3 tools/test_refresh.py
      - run: python3 -m py_compile eval/run.py tools/refresh_lexicon.py
