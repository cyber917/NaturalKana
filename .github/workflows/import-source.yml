name: Import checked source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand source
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, zipfile
          archive = Path('NaturalKana-source.zip')
          expected = 'aa5baec6a232faec1ce589c73ec7738f1abf07abdf6098e600fda641f496937c'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Source archive checksum differs'
          with zipfile.ZipFile(archive) as bundle:
              assert len(bundle.infolist()) == 88
              assert sum(item.file_size for item in bundle.infolist()) < 5_000_000
              for item in bundle.infolist():
                  path = Path(item.filename)
                  assert path.parts[0] == 'NaturalKana' and '..' not in path.parts and not path.is_absolute()
                  relative = Path(*path.parts[1:])
                  assert relative.parts and '.git' not in relative.parts
                  destination = Path.cwd() / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(bundle.read(item))
                  destination.chmod((item.external_attr >> 16) & 0o777 or 0o644)
          archive.unlink()
          Path('.github/workflows/import-source.yml').unlink()
          PYTHON
      - name: Commit imported project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: import checked NaturalKana source'
          git push origin HEAD:main
