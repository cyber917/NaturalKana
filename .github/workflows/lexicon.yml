name: Review lexicon candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  propose:
    if: vars.LEXICON_REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research with hosted web search
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEXICON_MODEL: ${{ vars.LEXICON_MODEL }}
        run: python tools/refresh_lexicon.py
      - name: Open a review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- lexicon NaturalSuggestCore/Sources/NaturalSuggestCore/Resources/slang.jsonl)" ]; then exit 0; fi
          branch="lexicon-candidates-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lexicon NaturalSuggestCore/Sources/NaturalSuggestCore/Resources/slang.jsonl
          git commit -m 'chore: propose lexicon candidates for human review'
          git push origin "$branch"
          gh label create lexicon-candidates --color 1D76DB --force
          gh pr create --title 'Review Japanese lexicon candidates' --body-file docs/LEXICON_PR.md --label lexicon-candidates --head "$branch"
